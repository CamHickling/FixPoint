[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixpoint"
version = "0.1.0"
description = "Validate and correct Pupil Labs Neon gaze on a projected screen using a 3x3 cross calibration and AprilTags"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "opencv-python>=4.10",
    "pupil-apriltags>=1.0.4",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fixpoint = "fixpoint.__main__:main"

[tool.setuptools]
packages = ["fixpoint"]

[tool.setuptools.package-data]
fixpoint = ["slides/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
